[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mark-point-checker"
version = "1.0.0"
description = "Mark short written answers against exam-style marking points, with feedback students can act on. No AI model; a JavaScript twin runs in the browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kalid Nur" }]
keywords = ["education", "marking", "assessment", "feedback", "teachers", "edtech"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Education",
  "Topic :: Education",
]

[project.scripts]
markpoint = "markpoint.cli:main"

[tool.setuptools]
packages = ["markpoint"]
